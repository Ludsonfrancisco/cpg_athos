<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPG · Igreja Athos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .logo-img {
      width: 180px;
      height: auto;
    }
    .brand {
      text-align: center;
    }
    .brand-igreja {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #5C3D2E;
      font-weight: 400;
    }
    .brand-athos {
      font-size: 72px;
      font-weight: 800;
      color: #5C3D2E;
      line-height: 1;
      letter-spacing: -1px;
      margin-top: 2px;
    }
    .brand-tagline {
      font-size: 16px;
      color: #5C3D2E;
      letter-spacing: 2px;
      margin-top: 10px;
      font-weight: 300;
    }
    .brand-tagline span {
      margin: 0 6px;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #5C3D2E;
      opacity: 0.25;
      margin: 24px 0;
    }
    .cpg-title {
      font-size: 18px;
      color: #5C3D2E;
      font-weight: 400;
      letter-spacing: 1px;
      text-align: center;
    }
    .cpg-sub {
      font-size: 13px;
      color: #8B7355;
      margin-top: 6px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #8B7355;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <img class="logo-img" src="logo.png" alt="Igreja Athos">
    <div class="brand">
      <div class="brand-igreja">Igreja</div>
      <div class="brand-athos">Athos</div>
      <div class="brand-tagline">
        <span>servir</span> · <span>amar</span> · <span>cuidar</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="cpg-title">Coordenação de Planejamento e Gestão</div>
    <div class="cpg-sub">Igreja Athos · 2026</div>
  </div>
  <footer>cpgathos.palmbook.online</footer>
</body>
</html>
